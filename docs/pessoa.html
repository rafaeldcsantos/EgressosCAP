<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PGCAP — Informações gerais</title>
  <link rel="icon" href="assets/images/favicon.ico" sizes="any">
  <link rel="stylesheet" href="css/egressos.css">
  <link rel="stylesheet" href="css/cabecalho.css">
  <link rel="stylesheet" href="css/pessoa.css">
</head>
<body>
  <header class="topo"><a class="marca" href="index.html"><img class="logo-cap" src="assets/images/LogoPill.svg" alt="Logo CAP"><span class="marca-titulo">Informações gerais</span></a></header>
  <main class="conteudo pessoa">
    <p class="rotulo">Informações gerais</p>
    <p id="estado" role="status">Carregando informações…</p>
    <article id="perfil" hidden>
      <div class="apresentacao-pessoa"><div class="area-retrato"><img id="retrato" alt="" hidden><span id="sinal-falecimento" class="sinal-falecimento" hidden role="img" aria-label="Pessoa falecida" title="Pessoa falecida"></span></div><div><h1 id="nome"></h1><p>Programa de Pós-Graduação em Computação Aplicada · INPE</p></div></div>
      <section aria-labelledby="titulo-resumo"><h2 id="titulo-resumo">Resumo (Plataforma Lattes)</h2><p id="resumo"></p></section>
      <section id="secao-linhas-pesquisa" aria-labelledby="titulo-linhas-pesquisa" hidden><h2 id="titulo-linhas-pesquisa">Linhas de pesquisa (Plataforma Lattes)</h2><ul id="linhas-pesquisa"></ul></section>
      <section id="secao-areas-atuacao" aria-labelledby="titulo-areas-atuacao" hidden><h2 id="titulo-areas-atuacao">Áreas de atuação (Plataforma Lattes)</h2><ul id="areas-atuacao"></ul></section>
      <section aria-labelledby="titulo-vinculos"><h2 id="titulo-vinculos">Vínculos com a CAP</h2><ul id="vinculos"></ul></section>
      <section aria-labelledby="titulo-links"><h2 id="titulo-links">Perfis públicos</h2><ul id="links-publicos"></ul></section>
    </article>
    <noscript>Ative o JavaScript para visualizar as informações da pessoa.</noscript>
  </main>
  <script src="js/pessoa.js"></script>
  <script src="js/rodape.js"></script>
</body>
</html>
